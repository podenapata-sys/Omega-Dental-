<article class="section" style="padding-top:40px"><div class="container" style="max-width:780px">
  <p data-en="Good dental habits start early. Helping your child care for their teeth now sets them up for a healthy, confident smile for life." data-bn="ভালো দন্ত-অভ্যাস শুরু হয় ছোটবেলায়। এখন আপনার শিশুকে দাঁতের যত্নে সাহায্য করলে সারাজীবনের সুস্থ, আত্মবিশ্বাসী হাসি নিশ্চিত হয়।" style="font-size:1.15rem;color:var(--ink);font-weight:500"></p>
  <h2 data-en="Start early" data-bn="আগেভাগে শুরু করুন" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="Begin cleaning your baby's gums even before teeth appear, and start brushing with a tiny smear of toothpaste once the first tooth comes in. A child's first dental visit is recommended around their first birthday." data-bn="দাঁত ওঠার আগেই শিশুর মাড়ি পরিষ্কার করা শুরু করুন, এবং প্রথম দাঁত উঠলে সামান্য টুথপেস্ট দিয়ে ব্রাশ শুরু করুন। শিশুর প্রথম ডেন্টাল ভিজিট প্রথম জন্মদিনের কাছাকাছি করার পরামর্শ দেওয়া হয়।" style="color:var(--muted)"></p><h2 data-en="Prevent cavities" data-bn="ক্যাভিটি প্রতিরোধ করুন" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="Limit sugary snacks and drinks, avoid letting your child sleep with a bottle of milk or juice, and supervise brushing twice a day until they can do it well themselves (usually around age 7)." data-bn="মিষ্টি স্ন্যাকস ও পানীয় সীমিত করুন, দুধ বা জুসের বোতল মুখে নিয়ে শিশুকে ঘুমাতে দেবেন না, এবং নিজে ভালোভাবে ব্রাশ করতে শেখার আগ পর্যন্ত (সাধারণত ৭ বছর) দিনে দুবার ব্রাশিং তত্ত্বাবধান করুন।" style="color:var(--muted)"></p><h2 data-en="Make it positive" data-bn="ইতিবাচক করে তুলুন" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="Talk about the dentist in a friendly, calm way and avoid words like &quot;pain&quot; or &quot;needle.&quot; Gentle, child-friendly visits help your child feel safe and build a lifelong comfort with dental care." data-bn="ডেন্টিস্ট নিয়ে বন্ধুত্বপূর্ণ, শান্তভাবে কথা বলুন এবং &quot;ব্যথা&quot; বা &quot;সুঁই&quot;-এর মতো শব্দ এড়িয়ে চলুন। কোমল, শিশুবান্ধব ভিজিট শিশুকে নিরাপদ বোধ করায়।" style="color:var(--muted)"></p><h2 data-en="Don't ignore milk teeth" data-bn="দুধ দাঁত উপেক্ষা করবেন না" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="Baby teeth matter — they hold space for adult teeth and help with eating and speech. Treat decay early, even in milk teeth, to avoid pain and problems later." data-bn="দুধ দাঁত গুরুত্বপূর্ণ — এগুলো স্থায়ী দাঁতের জন্য জায়গা রাখে এবং খাওয়া ও কথায় সাহায্য করে। পরে ব্যথা ও সমস্যা এড়াতে দুধ দাঁতেও ক্ষয় আগেভাগে চিকিৎসা করান।" style="color:var(--muted)"></p>
  <div class="calc-out" style="margin-top:36px">
    <span data-en="Looking for gentle, child-friendly dental care in Dhaka? Book your little one's check-up with Dr. Afsana Haque at Omega Dental." data-bn="ঢাকায় কোমল, শিশুবান্ধব দন্তসেবা খুঁজছেন? ওমেগা ডেন্টালে ডা. আফসানা হকের কাছে আপনার সোনামণির চেকআপ বুক করুন।" style="display:block;margin-bottom:16px"></span>
