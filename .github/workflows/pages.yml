name: Deploy to GitHub Pages

on:
  push:
    # main only. Two branches deploying to one Pages site is last-push-wins, and
    # whichever pushed most recently silently decides what the clinic sees.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # The content editor commits only assets/content.js. This copies its prices into
      # the service-page tables, treatments.html and its Google price data, so an editor
      # publish goes live with every page in step. A failure here must never stop the
      # deploy: the pages then go out exactly as committed, as they did before.
      - name: Sync prices from content.js
        run: node tools/sync-prices.js || echo "::warning::sync-prices failed; pages deployed as committed"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
