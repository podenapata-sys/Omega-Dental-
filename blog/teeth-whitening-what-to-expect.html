<article class="section" style="padding-top:40px"><div class="container" style="max-width:780px">
  <p data-en="Professional whitening is one of the quickest ways to refresh your smile. Here's what actually happens and how to make the results last." data-bn="পেশাদার হোয়াইটেনিং হাসি ঝলমলে করার দ্রুততম উপায়গুলোর একটি। আসলে কী ঘটে এবং ফল কীভাবে দীর্ঘস্থায়ী করবেন জেনে নিন।" style="font-size:1.15rem;color:var(--ink);font-weight:500"></p>
  <h2 data-en="How it works" data-bn="কীভাবে কাজ করে" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="A safe whitening gel is applied to your teeth, often activated with a special light, to break down years of stains from tea, coffee, smoking and age. In about an hour your teeth can lighten by several shades." data-bn="দাঁতে একটি নিরাপদ হোয়াইটেনিং জেল লাগানো হয়, প্রায়ই বিশেষ লাইট দিয়ে সক্রিয় করা হয়, যা চা, কফি, ধূমপান ও বয়সের বছরের দাগ ভেঙে দেয়। প্রায় এক ঘণ্টায় দাঁত কয়েক শেড উজ্জ্বল হতে পারে।" style="color:var(--muted)"></p><h2 data-en="Is it safe?" data-bn="এটি কি নিরাপদ?" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="Yes — done by a dentist, whitening is safe for your enamel. We protect your gums first and control the strength of the gel, which is far safer and more effective than over-the-counter kits." data-bn="হ্যাঁ — ডেন্টিস্টের মাধ্যমে করা হলে এটি এনামেলের জন্য নিরাপদ। আমরা আগে মাড়ি সুরক্ষা করি ও জেলের মাত্রা নিয়ন্ত্রণ করি, যা দোকানের কিটের চেয়ে অনেক নিরাপদ ও কার্যকর।" style="color:var(--muted)"></p><h2 data-en="How long do results last?" data-bn="ফল কতদিন থাকে?" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="Results typically last from several months up to a couple of years, depending on your habits. Avoiding staining foods, not smoking and good brushing all help your bright smile last longer." data-bn="অভ্যাসভেদে ফল সাধারণত কয়েক মাস থেকে কয়েক বছর পর্যন্ত থাকে। দাগ-সৃষ্টিকারী খাবার এড়ানো, ধূমপান না করা ও ভালো ব্রাশিং উজ্জ্বল হাসি দীর্ঘস্থায়ী করে।" style="color:var(--muted)"></p><h2 data-en="Keeping your smile bright" data-bn="হাসি উজ্জ্বল রাখা" style="margin:28px 0 10px;font-size:1.4rem"></h2><p data-en="Cut back on coffee, tea and red wine, rinse with water after staining drinks, brush twice a day, and get regular cleanings. A touch-up every so often keeps things looking fresh." data-bn="কফি, চা ও রেড ওয়াইন কমান, দাগযুক্ত পানীয়ের পর পানি দিয়ে কুলকুচি করুন, দিনে দুবার ব্রাশ করুন ও নিয়মিত পরিষ্কার করান। মাঝে মাঝে টাচ-আপ সব তাজা রাখে।" style="color:var(--muted)"></p>
